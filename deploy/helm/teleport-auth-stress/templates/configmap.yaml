apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teleport-auth-stress.fullname" . }}-config
  labels:
    {{- include "teleport-auth-stress.labels" . | nindent 4 }}
data:
  # Rendered verbatim and mounted identically into the seed pod and
  # every load pod — the "identical step plans" requirement
  # (instructions.md "Distributed execution") is satisfied by every pod
  # literally reading the same file, not by separately-templated copies.
  config.yaml: |
{{ .Values.config | indent 4 }}
